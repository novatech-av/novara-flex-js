  /api.echo:
    post:
      tags:
      - api
      summary: Echo request data
      description: Testing method that echoes the object provided in the response property.
      operationId: apiEcho
      externalDocs:
        url: https://api.novaraflex.com/docs/method/api.echo
      x-novara-get-supported: true
      x-novara-get-note: The API also supports GET by placing a URL-encoded raw JSON object directly after '?'. This is intentionally
        not modeled as an OpenAPI GET operation because standard OpenAPI query parameters cannot accurately represent that
        wire format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: Novara Flex API token. Treat as a secret; tokens provide broad account access.
                  example: YOUR_TOKEN
                pretty:
                  type: boolean
                  default: false
                  description: When true, adds whitespace to JSON responses.
                  example: true
                response:
                  type: object
                  additionalProperties: true
                  description: Object to echo as the API response. Any JSON object is accepted; the API returns it as the entire
                    response body.
                  example:
                    ok: true
                    foo: bar
              required:
              - token
              - response
            example:
              token: YOUR_TOKEN
              pretty: true
              response:
                ok: true
                foo: bar
      responses:
        '200':
          description: Success or application-level error. Novara Flex documents both as HTTP 200; inspect the ok property.
          headers:
            HZS-Request-ID:
              description: Alpha-numeric request identifier used for support/debugging.
              schema:
                type: string
            HZS-Response-Time:
              description: Server processing time in milliseconds.
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties: {}
                  additionalProperties: true
                  description: Arbitrary object echoed by the API.
                - $ref: '#/components/schemas/ApiError'
