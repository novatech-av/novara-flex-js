  /attachment.load:
    post:
      tags:
      - attachment
      summary: Load attachment
      description: Loads an uploaded attachment. Published docs describe this request as being redirected to binary data.
        Observed on the live API 2026-09-29, a known key answers HTTP 302 with a cross-origin https Location whose GET
        serves the file, while an unknown key answers HTTP 200 with an application/json error envelope, error
        invalid_key_for_customer.
      operationId: attachmentLoad
      externalDocs:
        url: https://api.novaraflex.com/docs/method/attachment.load
      x-novara-get-supported: true
      x-novara-get-note: The API also supports GET by placing a URL-encoded raw JSON object directly after '?'. This is intentionally
        not modeled as an OpenAPI GET operation because standard OpenAPI query parameters cannot accurately represent that
        wire format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: Novara Flex API token. Treat as a secret; tokens provide broad account access.
                  example: YOUR_TOKEN
                pretty:
                  type: boolean
                  default: false
                  description: When true, adds whitespace to JSON responses.
                  example: true
                key:
                  type: string
                  description: Attachment storage key.
                  example: 33703da906bc12e595c499f0/public/elhz928rva67x255/photo.jpg
              required:
              - token
              - key
            example:
              token: YOUR_TOKEN
              pretty: true
              key: 33703da906bc12e595c499f0/public/elhz928rva67x255/photo.jpg
      responses:
        '200':
          description: Binary attachment or an application-level JSON error. On the live API only the JSON error has been
            seen with HTTP 200; a known key answered 302 (see below), and the binary media types here describe the file
            that redirect leads to.
          headers:
            HZS-Request-ID:
              description: Alpha-numeric request identifier used for support/debugging.
              schema:
                type: string
            HZS-Response-Time:
              description: Server processing time in milliseconds.
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '302':
          description: Redirect to the attachment's binary data, observed on the live API 2026-09-29. The Location is a
            cross-origin https URL that serves the file to a GET without a body. A client must not let a 307 or 308
            re-send the POST body, which carries the token, to that origin.
          headers:
            Location:
              description: The file's URL. Treat it as a credential; it may be signed.
              schema:
                type: string
