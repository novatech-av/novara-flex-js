paths:
  /account.info:
    post:
      tags:
      - account
      summary: Get account information
      description: Returns details for the organization associated with the API token.
      operationId: accountInfo
      externalDocs:
        url: https://api.novaraflex.com/docs/method/account.info
      x-novara-get-supported: true
      x-novara-get-note: The API also supports GET by placing a URL-encoded raw JSON object directly after '?'. This is intentionally
        not modeled as an OpenAPI GET operation because standard OpenAPI query parameters cannot accurately represent that
        wire format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: Novara Flex API token. Treat as a secret; tokens provide broad account access.
                  example: YOUR_TOKEN
                pretty:
                  type: boolean
                  default: false
                  description: When true, adds whitespace to JSON responses.
                  example: true
              required:
              - token
            example:
              token: YOUR_TOKEN
              pretty: true
      responses:
        '200':
          description: Success or application-level error. Novara Flex documents both as HTTP 200; inspect the ok property.
          headers:
            HZS-Request-ID:
              description: Alpha-numeric request identifier used for support/debugging.
              schema:
                type: string
            HZS-Response-Time:
              description: Server processing time in milliseconds.
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      enum:
                      - true
                    account:
                      $ref: '#/components/schemas/Account'
                  additionalProperties: true
                  required:
                  - ok
                  - account
                - $ref: '#/components/schemas/ApiError'
