              additionalProperties: false
              properties:
                token:
                  type: string
                  description: Novara Flex API token. Treat as a secret; tokens provide broad account access.
                  example: YOUR_TOKEN
                pretty:
                  type: boolean
                  default: false
                  description: When true, adds whitespace to JSON responses.
                  example: true
                form_id:
                  type: integer
                  description: Form ID.
                  example: 3987
                limit:
                  type: integer
                  default: 100
                  minimum: 1
                  maximum: 1000
                  description: Maximum responses returned.
                  example: 100
                page:
                  type: integer
                  default: 1
                  minimum: 1
                  description: 1-based page number.
                  example: 1
                observer_id:
                  type: string
                  description: Filter by observer user ID.
                  example: 5804f0f30ef50473af5870c6
                before:
                  type: integer
                  description: Only responses submitted before this Unix epoch time in milliseconds.
                  example: 1476981004760
                after:
                  type: integer
                  description: Only responses submitted after this Unix epoch time in milliseconds.
                  example: 1473688379489
                updated_before:
                  type: integer
                  description: Only responses updated before this Unix epoch time in milliseconds.
                  example: 1476981004760
                updated_after:
                  type: integer
                  description: Only responses updated after this Unix epoch time in milliseconds.
                  example: 1473688379489
                format:
                  type: string
                  default: json
                  enum:
                  - json
                  - csv
                  description: Response format.
                  example: csv
                columns:
                  type: array
                  items:
                    type: string
                  description: Columns to fetch.
                  example:
                  - report number
                  - observer
                  - temperature
                response_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  description: Specific response IDs to fetch.
                  example:
                  - 1023833
                  - 1103837
                deleted:
                  type: boolean
                  default: false
                  description: False returns non-deleted responses; true returns deleted responses.
                  example: true
                skip_field_id_mapping:
                  type: boolean
                  default: false
                  description: 'CSV only: omit the field-ID to field-title mapping row.'
                  example: false
                skip_field_id_mapping_json:
                  type: boolean
                  default: false
                  description: 'JSON only: omit the field-ID to field-title mapping row.'
                  example: false
                force_date_format:
                  type: boolean
                  default: false
                  description: Force dates to YYYY-MM-DD HH:mm:ss.
                  example: false
              required:
              - token
              - form_id
            example:
              token: YOUR_TOKEN
              pretty: true
              form_id: 3987
              limit: 100
              page: 1
              observer_id: 5804f0f30ef50473af5870c6
              before: 1476981004760
              after: 1473688379489
              updated_before: 1476981004760
              updated_after: 1473688379489
              format: csv
              columns:
              - report number
              - observer
              - temperature
              response_ids:
              - 1023833
              - 1103837
              deleted: true
              skip_field_id_mapping: false
              skip_field_id_mapping_json: false
              force_date_format: false
      responses:
        '200':
          description: Successful JSON/CSV output or an application-level JSON error. Check content type and, for JSON, the
            ok field.
          headers:
            HZS-Request-ID:
              description: Alpha-numeric request identifier used for support/debugging.
              schema:
                type: string
            HZS-Response-Time:
              description: Server processing time in milliseconds.
              schema:
                type: integer
            novaraflex-total-results:
              description: Total matching results when CSV is requested. Observed on the live API 2026-09-29, alongside
                identical legacy iscout- and kpaehs- pairs that are not modeled here.
              schema:
                type: integer
            novaraflex-last-page:
              description: Last valid page number when CSV is requested.
              schema:
                type: integer
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      enum:
                      - true
                    responses:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                      description: 'The flattened rows, observed on the wire 2026-09-19. Each row is a flat object keyed by
                        the form''s own field identifiers, so the keys vary per form and are deliberately not enumerated. Unless
                        skip_field_id_mapping_json is true, the first row is a field-ID to field-title mapping row whose values
                        are all strings and which is not counted against limit; the data rows that follow carry string, integer,
                        or number values.'
                    paging:
                      $ref: '#/components/schemas/Paging'
                  required:
                  - ok
                  - responses
                  - paging
                  additionalProperties: true
                  description: Published docs do not provide a complete JSON example for this endpoint; the row fields are
                    intentionally permissive.
                - $ref: '#/components/schemas/ApiError'
            text/csv:
              schema:
                type: string
