openapi: 3.1.0
info:
  title: Novara Flex (KPA Flex) API
  version: v1-unofficial-2026-09-29
  description: 'Unofficial OpenAPI 3.1 specification derived from the public Novara Flex API documentation. The upstream API
    uses a JSON-RPC-style convention over method-specific HTTPS URLs. Every documented method accepts GET or POST; this specification
    models POST because POST uses a normal JSON request body and is compatible with OpenAPI tooling. For GET, Novara Flex
    expects a URL-encoded raw JSON object as the entire query string, a convention OpenAPI cannot model faithfully. Authentication
    is a `token` field inside every request object rather than an HTTP Authorization header, so no OpenAPI securityScheme
    is declared. The published protocol states that application-level failures are also returned with HTTP 200 and `ok: false`.
    This file is not an official Novara/KPA artifact; verify critical fields against the linked upstream method documentation
    before production use. Re-checked against the published method documentation on 2026-09-29: every documented request
    parameter is declared, and documented response properties missing until then were added as optional, with their types
    checked on the live API wherever records were available (the live API wins where the two disagree). The `required`
    lists of the response schemas come from live observation: a property is required only where every observed record
    from every method that returns its schema carried it, and present-but-null counts as present, so a nullable property
    can be required. A schema observed too rarely to judge has only its identity fields required, a shape not yet
    observed on the wire has none, and a property that appears only behind a request flag stays optional.'
externalDocs:
  description: Official Novara Flex API documentation
  url: https://api.novaraflex.com/docs/
servers:
- url: https://api.novaraflex.com/v1
  description: Novara Flex production API
