components:
  schemas:
    ApiError:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
        error:
          type: string
          enum:
          - api_method_not_found
          - request_method_invalid
          - request_data_invalid
          - rate_limit_exceeded
          - token_missing
          - token_invalid
          - token_inactive
          - token_permission
          - account_inactive
          - parameter_unexpected
          - parameter_missing
          - parameter_invalid
          - server_error
          - content_not_found
          - invalid_key_for_customer
        description:
          type: string
      additionalProperties: true
      required:
      - ok
      - error
      description: Application-level error. Novara Flex documents these as HTTP 200 responses.
    Paging:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 0
      additionalProperties: true
      required:
      - total
      - last_page
    Account:
      description: Only the identity fields are required until more records of this schema have been observed on the
        live API.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subdomain:
          type: string
        created:
          type: integer
        expiresOn:
          type: integer
        userMetafields:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
                description: 'Values in the docs examples, here and for equipment metafields: text, number, list. Not an enum.'
              list_id:
                type:
                - integer
                - 'null'
                description: Nullable to match EquipmentMetafield.list_id, which the live API sends as null on metafields
                  that are not list-backed.
            additionalProperties: true
            required:
            - id
            - name
            - type
            - list_id
      additionalProperties: true
      required:
      - id
      - name
    AcknowledgmentRecipient:
      description: No property is required, because it has no identity field and too few records of this schema have
        been observed on the live API to judge the rest.
      type: object
      properties:
        user_id:
          type: string
        acknowledgedOn:
          type:
          - integer
          - 'null'
      additionalProperties: true
    Acknowledgment:
      description: Only the identity fields are required until more records of this schema have been observed on the
        live API.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created:
          type: integer
        author_id:
          type: string
        specificEmployees_id:
          type: array
          items:
            type: string
        fieldOffices_id:
          type: array
          items:
            type: string
        linesOfBusiness_id:
          type: array
          items:
            type: string
        jobTitles_id:
          type: array
          items:
            type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/AcknowledgmentRecipient'
      additionalProperties: true
      required:
      - id
      - name
    Company:
      description: Only the identity fields are required until more records of this schema have been observed on the
        live API.
      type: object
      properties:
        name:
          type: string
        created:
          type: integer
        id:
          type: string
      additionalProperties: true
      required:
      - name
      - id
    CompletedTraining:
      type: object
      properties:
        id:
          type: integer
        training_id:
          type: integer
        m_user_id:
          type: string
        created:
          type: integer
        date_number:
          type: integer
        special_expiration_date_number:
          type:
          - integer
          - 'null'
        m_instructor_id:
          type:
          - string
          - 'null'
        group_training_id:
          type:
          - integer
          - 'null'
        notes:
          type:
          - string
          - 'null'
          description: Observed as null on the live API on 2026-09-29, although the docs example shows a string.
        signature: {}
        files:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
      additionalProperties: true
      required:
      - id
      - training_id
      - m_user_id
      - created
      - date_number
      - special_expiration_date_number
      - m_instructor_id
      - group_training_id
      - notes
