    FormField:
      description: 'One field of a form version, discriminated on type. The published docs describe neither the field
        types nor their settings; the types and every settings shape here were observed on the live API across form
        definitions and every version of each (include_versions) on 2026-09-27, and re-checked on 2026-09-29.
        No earlier version used a type outside this set. The common types carry a typed settings object; the rare ones
        (counter, calculation, followup, subreport) keep settings open. A settings key is required only where every
        field of that type, in every version, carried it. Field-level display flags (hidden, varName, showif, and
        similar) are not modeled and pass through as additional properties.'
      oneOf:
      - $ref: '#/components/schemas/FormFieldAttachments'
      - $ref: '#/components/schemas/FormFieldCalculation'
      - $ref: '#/components/schemas/FormFieldCheckbox'
      - $ref: '#/components/schemas/FormFieldCounter'
      - $ref: '#/components/schemas/FormFieldDatetime'
      - $ref: '#/components/schemas/FormFieldDescription'
      - $ref: '#/components/schemas/FormFieldFollowup'
      - $ref: '#/components/schemas/FormFieldGroupSignature'
      - $ref: '#/components/schemas/FormFieldHeading'
      - $ref: '#/components/schemas/FormFieldSelect'
      - $ref: '#/components/schemas/FormFieldSketch'
      - $ref: '#/components/schemas/FormFieldSubreport'
      - $ref: '#/components/schemas/FormFieldText'
      discriminator:
        propertyName: type
        mapping:
          attachments: '#/components/schemas/FormFieldAttachments'
          calculation: '#/components/schemas/FormFieldCalculation'
          checkbox: '#/components/schemas/FormFieldCheckbox'
          counter: '#/components/schemas/FormFieldCounter'
          datetime: '#/components/schemas/FormFieldDatetime'
          description: '#/components/schemas/FormFieldDescription'
          followup: '#/components/schemas/FormFieldFollowup'
          groupsignature: '#/components/schemas/FormFieldGroupSignature'
          heading: '#/components/schemas/FormFieldHeading'
          select: '#/components/schemas/FormFieldSelect'
          sketch: '#/components/schemas/FormFieldSketch'
          subreport: '#/components/schemas/FormFieldSubreport'
          text: '#/components/schemas/FormFieldText'
    FormFieldAttachments:
      description: A file or photo upload field.
      allOf:
      - $ref: '#/components/schemas/FormFieldBase'
      - type: object
        properties:
          type:
            type: string
