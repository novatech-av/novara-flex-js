# Offline gates only: this workflow never runs the live suite (`pnpm test:live`),
# never calls the Novara Flex API, and uses no secrets. `release.yml` also calls
# it (`workflow_call`) to run the same gates before it publishes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm from mise.toml
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck, lint, test, build)
        run: pnpm check

      - name: Check generated types are up to date
        run: pnpm generate:check

      - name: Lint the package
        run: pnpm lint:package

      - name: Pack the tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  consumer-smoke:
    name: Consumer smoke (Node ${{ matrix.label }})
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 22.12.0, engines minimum
            node: 22.12.0
            mise-cache-prefix: mise-v1-node-22.12.0
          # A floating version resolves to the newest 22.x on every run, so it
          # gets no tool cache: a restored cache would pin an older 22.x.
          - label: latest 22
            node: "22"
            mise-cache-prefix: ""
          # No override: the mise.toml pin, the same tools as the gates job.
          - label: 24, mise.toml pin
            node: ""
            mise-cache-prefix: mise-v1
    env:
      # mise's per-tool override; empty means the mise.toml version.
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm from mise.toml
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: ${{ matrix.mise-cache-prefix != '' }}
          cache_key_prefix: ${{ matrix.mise-cache-prefix || 'mise-v1' }}

      - name: Show the Node version
        run: node --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Only for the repository's TypeScript, which type-checks the consumer.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package

      - name: Run the consumer smoke test
        run: node scripts/consumer-smoke/run.mjs "$RUNNER_TEMP"/package/*.tgz

  ci:
    name: CI
    if: always()
    needs: [gates, consumer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
